services:
  - type: web
    name: lydop-api
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_PASSWORD   # password for every demo account (super@lucena.gov.ph, admin@lucena.gov.ph, youth1..10@gmail.com)
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lydop-db
          property: connectionString
      # Set these after you know your Vercel URL:
      - key: ALLOWED_HOSTS
        value: lydop-api.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://YOUR-APP.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://YOUR-APP.vercel.app
      - key: FRONTEND_URL
        value: https://YOUR-APP.vercel.app
databases:
  - name: lydop-db
    plan: free
